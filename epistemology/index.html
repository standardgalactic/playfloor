<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Epistemology Survey Instrument</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#7cff7c;
  font-family:monospace;
  touch-action:manipulation;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  cursor:pointer;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:500;
  background:
    repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,.03) 0px,
      rgba(255,255,255,.03) 1px,
      transparent 2px,
      transparent 5px
    );
  opacity:.13;
}

.title{
  position:fixed;
  top:18px;
  width:94vw;
  text-align:center;
  font-size:14px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:#00ff88;
  text-shadow:0 0 10px #00ff66;
  z-index:100;
}

.selector{
  position:fixed;
  top:50px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:center;
  width:94vw;
  z-index:120;
  cursor:default;
}

.selector button{
  background:#001400;
  border:1px solid rgba(0,255,100,.55);
  color:#7cff7c;
  padding:7px 10px;
  font-family:monospace;
  font-size:10px;
  letter-spacing:.08em;
  cursor:pointer;
}

.selector button.active{
  background:#003d1a;
  color:#eaffea;
  box-shadow:0 0 8px #00ff66 inset;
}

.status{
  position:fixed;
  top:90px;
  opacity:.45;
  font-size:10px;
  letter-spacing:.14em;
  z-index:120;
}

canvas{
  width:min(380px,78vw);
  height:min(380px,78vw);
  border-radius:50%;
  border:3px solid rgba(0,255,120,.46);
  background:#000;
  box-shadow:
    0 0 55px rgba(0,255,120,.16) inset,
    0 0 22px rgba(0,255,0,.55);
  z-index:40;
}

.subs{
  position:fixed;
  bottom:24px;
  width:min(650px,92vw);
  min-height:2.5em;
  padding:8px 12px;
  text-align:center;
  font-size:14px;
  line-height:1.45;
  color:#aaffaa;
  text-shadow:0 0 6px #00ff66;
  background:rgba(0,20,0,.36);
  border:1px solid rgba(0,255,0,.22);
  border-radius:6px;
  pointer-events:none;
  z-index:80;
}

@media(max-width:700px){
  .title{top:14px;font-size:11px}
  .selector{top:44px}
  .selector button{font-size:8px;padding:6px 6px}
  .status{top:92px;font-size:9px}
  .subs{bottom:18px;font-size:13px}
}
</style>
</head>

<body>

<div class="title" id="title">Epistemology Survey Instrument</div>
<div class="selector" id="selector"></div>
<div class="status">TOUCH / CLICK ANYWHERE TO PLAY OR PAUSE</div>
<canvas id="viz"></canvas>
<div class="subs" id="subs"></div>

<audio id="audio" preload="auto"></audio>

<script>
const tracks = [
  {
    file:"The_Geometry_of_Human_Intuition.mp3",
    vtt:"The_Geometry_of_Human_Intuition.vtt",
    label:"Intuition",
    title:"The Geometry of Human Intuition",
    mode:"intuition"
  },
  {
    file:"Why_AI_Hallucinations_and_Meritocracy_Align.mp3",
    vtt:"Why_AI_Hallucinations_and_Meritocracy_Align.vtt",
    label:"Hallucination",
    title:"Why AI Hallucinations and Meritocracy Align",
    mode:"hallucination"
  },
  {
    file:"The_Hidden_Curvature_of_Reality.mp3",
    vtt:"The_Hidden_Curvature_of_Reality.vtt",
    label:"Curvature",
    title:"The Hidden Curvature of Reality",
    mode:"curvature"
  },
  {
    file:"Why_AI_Replaces_Projections_Not_People.mp3",
    vtt:"Why_AI_Replaces_Projections_Not_People.vtt",
    label:"Projection",
    title:"Why AI Replaces Projections Not People",
    mode:"projection"
  }
];

let trackIndex = 0;
let mode = tracks[0].mode;

const audio = document.getElementById("audio");
const subs = document.getElementById("subs");
const title = document.getElementById("title");
const selector = document.getElementById("selector");

let audioCtx;
let analyser;
let freqData;
let timeData;

function initAudio(){
  if(audioCtx) return;

  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048;
  analyser.smoothingTimeConstant = .88;

  freqData = new Uint8Array(analyser.frequencyBinCount);
  timeData = new Uint8Array(analyser.fftSize);

  const source = audioCtx.createMediaElementSource(audio);
  source.connect(analyser);
  analyser.connect(audioCtx.destination);
}

function buildSelector(){
  selector.innerHTML = "";

  tracks.forEach((track,i)=>{
    const button = document.createElement("button");
    button.textContent = track.label;

    button.onclick = async e=>{
      e.stopPropagation();
      initAudio();
      if(audioCtx.state === "suspended") await audioCtx.resume();
      await loadTrack(i,true);
    };

    selector.appendChild(button);
  });
}

function updateButtons(){
  [...selector.querySelectorAll("button")]
    .forEach((button,i)=>{
      button.classList.toggle("active",i===trackIndex);
    });
}

async function loadTrack(i,autoplay=true){
  trackIndex = ((i % tracks.length) + tracks.length) % tracks.length;

  const track = tracks[trackIndex];

  mode = track.mode;
  title.textContent = track.title;

  audio.src = track.file;
  audio.load();

  updateButtons();
  await loadVTT(track.vtt);

  if(autoplay){
    try{ await audio.play(); }catch(e){}
  }
}

audio.addEventListener("ended",()=>{
  loadTrack(trackIndex+1,true);
});

document.body.onclick = async ()=>{
  initAudio();

  if(audioCtx.state === "suspended")
    await audioCtx.resume();

  if(audio.paused)
    await audio.play();
  else
    audio.pause();
};

/* subtitles */

let cues = [];

async function loadVTT(url){
  cues = [];
  subs.textContent = "";

  try{
    const res = await fetch(url);
    if(!res.ok){
      console.warn("Missing VTT:",url);
      return;
    }

    cues = parseVTT(await res.text());
  }catch(e){
    console.warn("VTT load failed:",e);
  }
}

function parseVTT(text){
  const blocks = text.replace(/\r/g,"").split(/\n{2,}/);
  const out = [];

  for(const block of blocks){
    const lines = block.trim().split("\n");
    const ts = lines.find(line=>line.includes("-->"));
    if(!ts) continue;

    const tsIndex = lines.indexOf(ts);
    const [start,end] = ts.split("-->").map(x=>x.trim());

    out.push({
      start:parseTime(start),
      end:parseTime(end),
      text:lines.slice(tsIndex+1).join(" ")
    });
  }

  return out;
}

function parseTime(t){
  t = t.split(" ")[0].replace(",",".");
  const p = t.split(":");

  if(p.length === 3)
    return (+p[0])*3600 + (+p[1])*60 + parseFloat(p[2]);

  return (+p[0])*60 + parseFloat(p[1]);
}

audio.ontimeupdate = ()=>{
  const t = audio.currentTime;
  const cue = cues.find(c=>t>=c.start && t<c.end+.2);
  subs.textContent = cue ? cue.text : "";
};

/* visualizer */

const canvas = document.getElementById("viz");
const ctx = canvas.getContext("2d");

const W = 440;
const H = 440;
const cx = W/2;
const cy = H/2;
const R = W*.39;

canvas.width = W;
canvas.height = H;

let frame = 0;
let bass = 0;
let mid = 0;
let high = 0;

function updateEnergy(){
  if(!analyser) return;

  analyser.getByteFrequencyData(freqData);

  let b=0,m=0,h=0;

  for(let i=0;i<36;i++) b += freqData[i];
  for(let i=36;i<160;i++) m += freqData[i];
  for(let i=160;i<freqData.length;i++) h += freqData[i];

  b /= 36*255;
  m /= 124*255;
  h /= (freqData.length-160)*255;

  bass += (b-bass)*.08;
  mid += (m-mid)*.06;
  high += (h-high)*.05;
}

function clearPortal(){
  ctx.fillStyle = "rgba(0,5,0,.10)";
  ctx.fillRect(0,0,W,H);

  ctx.save();
  ctx.beginPath();
  ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.clip();

  const g = ctx.createRadialGradient(cx,cy,0,cx,cy,R);
  g.addColorStop(0,"rgba(0,32,12,.24)");
  g.addColorStop(.72,"rgba(0,8,0,.42)");
  g.addColorStop(1,"rgba(0,0,0,.94)");

  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  drawStars();

  ctx.restore();

  ctx.beginPath();
  ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.strokeStyle = "rgba(124,255,196,.35)";
  ctx.lineWidth = 3;
  ctx.shadowBlur = 12;
  ctx.shadowColor = "#00ff66";
  ctx.stroke();
  ctx.shadowBlur = 0;
}

function drawStars(){
  ctx.fillStyle = "rgba(180,255,210,.14)";

  for(let i=0;i<32;i++){
    const x = ((Math.sin(i*91.7)*43758.5453)%1+1)%1;
    const y = ((Math.sin(i*47.3+2)*19341.13)%1+1)%1;
    const px = x*W;
    const py = y*H;

    const dx = px-cx;
    const dy = py-cy;

    if(dx*dx+dy*dy < R*R){
      ctx.fillRect(px,py,1.4,1.4);
    }
  }
}

function drawContourField(alphaBoost=1){
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.clip();

  for(let k=0;k<16;k++){
    const r = R*(.13+k*.05);

    ctx.beginPath();

    for(let a=0;a<=Math.PI*2+.04;a+=.05){
      const elevation =
        Math.sin(a*4 + frame*.004 + k) *
        (3 + high*12);

      const bend =
        Math.cos(a*2 - frame*.003 + k*.7) *
        (2 + mid*8);

      const x =
        cx +
        Math.cos(a) *
        (r+elevation+bend);

      const y =
        cy +
        Math.sin(a) *
        (r+elevation*.7-bend*.25);

      if(a===0) ctx.moveTo(x,y);
      else ctx.lineTo(x,y);
    }

    ctx.strokeStyle =
      `rgba(124,255,196,${(.014+k*.008)*alphaBoost})`;

    ctx.lineWidth = 2.2;
    ctx.stroke();
  }

  ctx.restore();
}

function drawIntuition(){
  drawContourField(.85);

  ctx.save();
  ctx.beginPath();
  ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.clip();

  const start = {x:cx-R*.52,y:cy+R*.34};
  const midp  = {x:cx-R*.10,y:cy-R*.10};
  const end   = {x:cx+R*.48,y:cy-R*.38};

  ctx.beginPath();
  ctx.moveTo(start.x,start.y);
  ctx.quadraticCurveTo(midp.x,midp.y,end.x,end.y);

  ctx.strokeStyle = "rgba(190,255,220,.86)";
  ctx.lineWidth = 7;
  ctx.lineCap = "round";
  ctx.shadowBlur = 18;
  ctx.shadowColor = "#00ff88";
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(end.x,end.y,20+bass*40,0,Math.PI*2);
  ctx.strokeStyle = "rgba(124,255,196,.24)";
  ctx.lineWidth = 5;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(end.x,end.y,9+bass*8,0,Math.PI*2);
  ctx.fillStyle = "rgba(220,255,230,.92)";
  ctx.fill();

  ctx.restore();

  drawHeavyTrace(.11);
}

function drawHallucination(){
  drawContourField(.65);

  ctx.save();
  ctx.beginPath();
  ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.clip();

  const origin = {x:cx,y:cy};

  for(let i=0;i<20;i++){
    const a = i/20*Math.PI*2 + frame*.002;
    const end = {
      x:cx + Math.cos(a)*R*.76,
      y:cy + Math.sin(a*1.08)*R*.72
    };

    const control = {
      x:cx + Math.cos(a+.7)*R*(.28+mid*.18),
      y:cy + Math.sin(a-.4)*R*(.28+high*.16)
    };

    const plausible =
      .06 +
      Math.max(0,Math.sin(frame*.018+i*.9))*.18 +
      high*.10;

    ctx.beginPath();
    ctx.moveTo(origin.x,origin.y);
    ctx.quadraticCurveTo(control.x,control.y,end.x,end.y);

    ctx.strokeStyle = `rgba(124,255,196,${plausible})`;
    ctx.lineWidth = 4.5;
    ctx.lineCap = "round";
    ctx.shadowBlur = 10;
    ctx.shadowColor = "#00ff88";
    ctx.stroke();

    if(i%5===0){
      ctx.beginPath();
      ctx.arc(end.x,end.y,7+high*10,0,Math.PI*2);
      ctx.fillStyle = "rgba(190,255,220,.55)";
      ctx.fill();
    }
  }

  ctx.restore();

  drawHeavyTrace(.20);
}

function drawCurvature(){
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.clip();

  for(let k=0;k<24;k++){
    ctx.beginPath();

    const r = R*(.08+k*.032);

    for(let a=0;a<=Math.PI*2+.04;a+=.04){
      const warp =
        Math.sin(a*3 + frame*.008 + k*.15) *
        (5+mid*22);

      const hidden =
        Math.cos(a*8 - frame*.006 + k) *
        (1+high*7);

      const x =
        cx +
        Math.cos(a)*(r+warp+hidden);

      const y =
        cy +
        Math.sin(a)*(r-warp*.40+hidden*.2);

      if(a===0) ctx.moveTo(x,y);
      else ctx.lineTo(x,y);
    }

    ctx.strokeStyle =
      `rgba(124,255,196,${.018+k*.009})`;

    ctx.lineWidth = 3;
    ctx.shadowBlur = 5;
    ctx.shadowColor = "#00ff88";
    ctx.stroke();
  }

  ctx.restore();

  drawHeavyTrace(.15);
}

function drawProjection(){
  drawContourField(.85);

  ctx.save();
  ctx.beginPath();
  ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.clip();

  const slice =
    (Math.sin(frame*.010)+1)*.5;

  const x =
    cx - R*.78 + slice*R*1.56;

  ctx.fillStyle = "rgba(180,255,210,.10)";
  ctx.fillRect(x-22,cy-R,44,R*2);

  ctx.beginPath();
  ctx.moveTo(x,cy-R*.85);
  ctx.lineTo(x,cy+R*.85);

  ctx.strokeStyle = "rgba(220,255,230,.88)";
  ctx.lineWidth = 6;
  ctx.lineCap = "round";
  ctx.shadowBlur = 20;
  ctx.shadowColor = "#00ff88";
  ctx.stroke();

  for(let j=0;j<7;j++){
    const y = cy-R*.62+j*R*.20;

    ctx.beginPath();
    ctx.arc(
      x + Math.sin(frame*.02+j)*12,
      y,
      5+mid*6,
      0,
      Math.PI*2
    );

    ctx.fillStyle = "rgba(190,255,220,.75)";
    ctx.fill();
  }

  ctx.restore();

  drawHeavyTrace(.17);
}

function drawHeavyTrace(lagBase){
  if(!analyser) return;

  analyser.getByteTimeDomainData(timeData);

  const lag = Math.floor(timeData.length*(lagBase+mid*.08));

  ctx.beginPath();

  for(let i=0;i<timeData.length;i+=3){
    const a = (timeData[i]-128)/128;
    const b = (timeData[(i+lag)%timeData.length]-128)/128;

    const x =
      cx +
      a*R*.54 +
      Math.sin(frame*.008)*10;

    const y =
      cy +
      b*R*.45 +
      Math.cos(frame*.006)*8;

    if(i===0) ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
  }

  ctx.strokeStyle = "rgba(124,255,196,.72)";
  ctx.lineWidth = 5;
  ctx.lineCap = "round";
  ctx.shadowBlur = 16;
  ctx.shadowColor = "#00ff66";
  ctx.stroke();
  ctx.shadowBlur = 0;
}

function draw(){
  frame++;
  updateEnergy();
  clearPortal();

  if(mode === "intuition") drawIntuition();
  if(mode === "hallucination") drawHallucination();
  if(mode === "curvature") drawCurvature();
  if(mode === "projection") drawProjection();

  requestAnimationFrame(draw);
}

buildSelector();
loadTrack(0,false);
draw();
</script>

</body>
</html>
