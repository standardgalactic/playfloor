<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frozen Process</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:#000;color:#7cff7c;font-family:monospace;
  touch-action:manipulation;
}

body{
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;cursor:pointer;
}

body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:500;
  background:repeating-linear-gradient(to bottom,
    rgba(255,255,255,.025) 0px,
    rgba(255,255,255,.025) 1px,
    transparent 2px,
    transparent 6px);
  opacity:.10;
}

.title{
  position:fixed;top:16px;width:94vw;text-align:center;
  font-size:12px;letter-spacing:.18em;text-transform:uppercase;
  color:#88ddaa;text-shadow:0 0 8px #00aa55;z-index:100;
  transition:color .8s,text-shadow .8s;
}

.selector{
  position:fixed;top:46px;display:flex;gap:8px;flex-wrap:wrap;
  justify-content:center;width:96vw;z-index:120;cursor:default;
}

.selector button{
  background:#000a04;border:1px solid rgba(0,200,80,.38);
  color:#55cc88;padding:6px 10px;font-family:monospace;
  font-size:9px;letter-spacing:.08em;cursor:pointer;
  transition:background .2s,color .2s,border-color .2s;
}

.selector button.active{
  background:#001f0d;color:#ccffdd;
  box-shadow:0 0 6px #00aa44 inset;
}

.status{
  position:fixed;top:88px;opacity:.32;font-size:9px;
  letter-spacing:.16em;color:#55aa77;z-index:120;
}

canvas{
  width:min(420px,80vw);height:min(420px,80vw);
  border-radius:50%;border:1px solid rgba(0,200,80,.22);
  background:#000;
  box-shadow:0 0 40px rgba(0,180,80,.06) inset,
             0 0 12px rgba(0,160,60,.22);
  z-index:40;
  transition:border-color .8s,box-shadow .8s;
}

.subs{
  position:fixed;bottom:24px;width:min(660px,90vw);
  min-height:2.4em;padding:8px 14px;text-align:center;
  font-size:13px;line-height:1.5;color:#88ccaa;
  text-shadow:0 0 5px #005533;background:rgba(0,12,6,.42);
  border:1px solid rgba(0,180,80,.15);border-radius:4px;
  pointer-events:none;z-index:80;
  font-style:italic;letter-spacing:.02em;
  transition:opacity .8s;
}

@media(max-width:700px){
  .title{top:12px;font-size:10px}
  .selector{top:40px}
  .selector button{font-size:8px;padding:5px 7px}
  .status{top:88px;font-size:8px}
  .subs{bottom:16px;font-size:12px}
}
</style>
</head>

<body>

<div class="title" id="title">Frozen Process</div>
<div class="selector" id="selector"></div>
<div class="status">touch · click to play or pause</div>
<canvas id="viz"></canvas>
<div id="subs" class="subs"></div>

<audio id="audio" preload="auto"></audio>

<script>
const tracks = [
  {
    file:"Everything_You_See_Is_A_Frozen_Process.mp3",
    vtt:"Everything_You_See_Is_A_Frozen_Process.vtt",
    label:"Process",
    title:"Everything You See Is A Frozen Process",
    mode:"process"
  },
  {
    file:"The_Physics_of_Admissible_Transformations.mp3",
    vtt:"The_Physics_of_Admissible_Transformations.vtt",
    label:"Transform",
    title:"The Physics of Admissible Transformations",
    mode:"transform"
  },
  {
    file:"The_blessing_of_infinite_dimensionality.mp3",
    vtt:"The_blessing_of_infinite_dimensionality.vtt",
    label:"Infinity",
    title:"The Blessing of Infinite Dimensionality",
    mode:"manifold"
  },
  {
    file:"How_files_rewrite_their_own_history.mp3",
    vtt:"How_files_rewrite_their_own_history.vtt",
    label:"Memory",
    title:"How Files Rewrite Their Own History",
    mode:"memory"
  }
];

let trackIndex = 0;
let mode = tracks[0].mode;

const audio    = document.getElementById("audio");
const subs     = document.getElementById("subs");
const titleEl  = document.getElementById("title");
const canvasEl = document.getElementById("viz");
const selector = document.getElementById("selector");

let audioCtx, analyser, freqData, timeData;

function initAudio(){
  if(audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048;
  analyser.smoothingTimeConstant = .90;
  freqData = new Uint8Array(analyser.frequencyBinCount);
  timeData = new Uint8Array(analyser.fftSize);
  const src = audioCtx.createMediaElementSource(audio);
  src.connect(analyser);
  analyser.connect(audioCtx.destination);
}

function buildSelector(){
  selector.innerHTML = "";
  tracks.forEach((t,i)=>{
    const btn = document.createElement("button");
    btn.textContent = t.label;    btn.onclick = async e=>{
      e.stopPropagation();
      initAudio();
      if(audioCtx.state==="suspended") await audioCtx.resume();
      await loadTrack(i,true);
    };
    selector.appendChild(btn);
  });
}

function updateButtons(){
  [...selector.querySelectorAll("button")]
    .forEach((b,i)=>b.classList.toggle("active",i===trackIndex));
}

async function loadTrack(i,autoplay=true){
  trackIndex = ((i%tracks.length)+tracks.length)%tracks.length;
  const t = tracks[trackIndex];
  mode = t.mode;
  titleEl.textContent = t.title;
  audio.src = t.file;
  audio.load();
  updateButtons();
  if(t.vtt) await loadVTT(t.vtt);
  if(autoplay){ try{ await audio.play(); }catch(e){} }
}

audio.addEventListener("ended",()=>loadTrack(trackIndex+1,true));

document.body.onclick = async ()=>{
  initAudio();
  if(audioCtx.state==="suspended") await audioCtx.resume();
  if(audio.paused) await audio.play();
  else audio.pause();
};

/* subtitles */

let cues = [];

async function loadVTT(url){
  cues = [];
  subs.textContent = "";
  try{
    const res = await fetch(url);
    if(!res.ok){ console.warn("Missing VTT:",url); return; }
    cues = parseVTT(await res.text());
  }catch(e){ console.warn("VTT:",e); }
}

function parseVTT(text){
  const out = [];
  for(const block of text.replace(/\r/g,"").split(/\n{2,}/)){
    const lines = block.trim().split("\n");
    const ts = lines.find(l=>l.includes("-->"));
    if(!ts) continue;
    const ti = lines.indexOf(ts);
    const [s,e] = ts.split("-->").map(x=>x.trim());
    out.push({start:parseTime(s),end:parseTime(e),text:lines.slice(ti+1).join(" ")});
  }
  return out;
}

function parseTime(t){
  t = t.split(" ")[0].replace(",",".");
  const p = t.split(":");
  if(p.length===3) return (+p[0])*3600+(+p[1])*60+parseFloat(p[2]);
  return (+p[0])*60+parseFloat(p[1]);
}

audio.ontimeupdate = ()=>{  const t = audio.currentTime;
  const c = cues.find(c=>t>=c.start&&t<c.end+.2);
  subs.textContent = c ? c.text : "";
};

/* canvas */

const canvas = canvasEl;
const ctx    = canvas.getContext("2d");
const W=480, H=480, cx=W/2, cy=H/2, R=W*.39;
canvas.width=W; canvas.height=H;

let frame=0, bass=0, mid=0, high=0;

function updateEnergy(){
  if(!analyser) return;
  analyser.getByteFrequencyData(freqData);
  let b=0,m=0,h=0;
  for(let i=0;i<40;i++) b+=freqData[i];
  for(let i=40;i<180;i++) m+=freqData[i];
  for(let i=180;i<freqData.length;i++) h+=freqData[i];
  bass+=(b/(40*255)-bass)*.07;
  mid +=(m/(140*255)-mid )*.05;
  high+=(h/((freqData.length-180)*255)-high)*.04;
}

/* ── portal clear ── */

function clearPortal(){
  ctx.fillStyle="rgba(0,3,1,.11)";
  ctx.fillRect(0,0,W,H);

  ctx.save();
  ctx.beginPath();
  ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.clip();

  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,R);
  g.addColorStop(0,"rgba(0,18,8,.30)");
  g.addColorStop(.65,"rgba(0,6,2,.50)");
  g.addColorStop(1,"rgba(0,0,0,.98)");
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);
  ctx.restore();

  ctx.beginPath();
  ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.strokeStyle="rgba(80,200,120,.18)";
  ctx.lineWidth=1.5;
  ctx.shadowBlur=8;
  ctx.shadowColor="#004422";
  ctx.stroke();
  ctx.shadowBlur=0;
}

/* ── shared trajectory substrate ── */

function drawTrajectoryField(alpha=.08){
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.clip();

  for(let i=0;i<80;i++){
    const phase = frame*.002 + i*.13;
    const x = cx + Math.sin(phase*1.3)*R*.7;
    const y = cy + Math.cos(phase*.9+i)*R*.6;
    ctx.beginPath();
    ctx.arc(x,y,1.5,0,Math.PI*2);
    ctx.fillStyle=`rgba(124,255,196,${alpha})`;
    ctx.fill();
  }
  ctx.restore();
}

/* ── memory ghost history ── */

const memoryTrails = [];
const MEMORY_MAX   = 320;

function recordMemory(){
  for(let i=0;i<80;i++){
    const phase = frame*.002 + i*.13;
    const x = cx + Math.sin(phase*1.3)*R*.7;
    const y = cy + Math.cos(phase*.9+i)*R*.6;
    memoryTrails.push({x,y,age:0});
  }
  while(memoryTrails.length > MEMORY_MAX) memoryTrails.shift();
  memoryTrails.forEach(p=>p.age++);
}

/* ── mode renderers ── */

// 1. Process — pure flow, nothing freezes
function drawProcess(){
  drawTrajectoryField(.10);

  ctx.save();
  ctx.beginPath();
  ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.clip();

  // additional faster streams
  for(let i=0;i<40;i++){
    const phase = frame*.005 + i*.22;
    const x0 = cx + Math.sin(phase*1.1)*R*.55;
    const y0 = cy + Math.cos(phase*.8+i*.3)*R*.50;
    const x1 = cx + Math.sin(phase*1.1+.08)*R*.55;
    const y1 = cy + Math.cos((phase+.08)*.8+i*.3)*R*.50;
    ctx.beginPath();
    ctx.moveTo(x0,y0);
    ctx.lineTo(x1,y1);
    ctx.strokeStyle=`rgba(124,255,196,${.04+mid*.12})`;
    ctx.lineWidth=2;
    ctx.stroke();
  }

  ctx.restore();
  drawWaveTrace(.14);
}

// 2. Transform — collisions, constraint arcs, merging paths
function drawTransform(){
  drawTrajectoryField(.06);

  ctx.save();
  ctx.beginPath();
  ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.clip();

  // constraint boundary — breathing ellipse
  ctx.beginPath();
  ctx.ellipse(
    cx, cy,
    R*(.48+bass*.08),
    R*(.38+mid*.06),
    frame*.003,
    0, Math.PI*2
  );
  ctx.strokeStyle="rgba(255,180,80,.28)";
  ctx.lineWidth=1.5;
  ctx.stroke();

  // colliding arc pairs
  for(let i=0;i<16;i++){
    const a  = i/16*Math.PI*2 + frame*.004;
    const a2 = a + Math.PI + Math.sin(frame*.007+i)*.4;
    const r  = R*(.55+Math.sin(frame*.009+i)*.12);

    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a)*r, cy+Math.sin(a)*r);
    ctx.quadraticCurveTo(
      cx+Math.cos(a+.6)*r*.5, cy+Math.sin(a+.6)*r*.5,
      cx+Math.cos(a2)*r*.7,   cy+Math.sin(a2)*r*.7
    );
    ctx.strokeStyle=`rgba(180,255,200,${.06+high*.08})`;
    ctx.lineWidth=2.5;
    ctx.stroke();
  }

  ctx.restore();
  drawWaveTrace(.16);
}

// 3. Manifold — sparse high-dim lattice, projections only
function drawManifold(){
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.clip();

  // sparse dimensional axes
  for(let i=0;i<22;i++){
    const a = i/22*Math.PI*2 + frame*.001;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.lineTo(cx+Math.cos(a)*R*.88, cy+Math.sin(a)*R*.88);
    ctx.strokeStyle=`rgba(100,220,160,${.025+high*.04})`;
    ctx.lineWidth=1;
    ctx.stroke();
  }

  // projected lattice rings
  for(let k=0;k<7;k++){
    const r = R*(.12+k*.11);
    ctx.beginPath();
    for(let a=0;a<=Math.PI*2+.06;a+=.06){
      const warp = Math.sin(a*5+frame*.004+k*1.3)*(2+high*8);
      const x = cx+Math.cos(a)*(r+warp);
      const y = cy+Math.sin(a)*(r+warp*.5);
      if(a===0) ctx.moveTo(x,y);
      else ctx.lineTo(x,y);
    }
    ctx.strokeStyle=`rgba(124,255,196,${.022+k*.012})`;
    ctx.lineWidth=1.5;
    ctx.stroke();
  }

  // far sparse nodes — the dimensions we can't fully see
  for(let i=0;i<28;i++){
    const a = i/28*Math.PI*2+frame*.0005;
    const r = R*(.65+Math.sin(i*3.7)*(.18+mid*.06));
    const x = cx+Math.cos(a)*r;
    const y = cy+Math.sin(a)*r;
    ctx.beginPath();
    ctx.arc(x,y,1.5,0,Math.PI*2);
    ctx.fillStyle="rgba(180,255,220,.18)";
    ctx.fill();
  }

  ctx.restore();
  drawWaveTrace(.11);
}

// 4. Memory — ghost traces, history as geometry
function drawMemory(){
  recordMemory();

  ctx.save();
  ctx.beginPath();
  ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.clip();

  const maxAge = MEMORY_MAX / 80;

  memoryTrails.forEach(p=>{
    const t = p.age / maxAge;           // 0 = recent, 1 = old
    const brightness = 1 - t*.85;
    const size = t < .1 ? 3.5 : 1.2;   // recent points glow larger

    ctx.beginPath();
    ctx.arc(p.x,p.y,size,0,Math.PI*2);

    if(t < .15){
      ctx.fillStyle=`rgba(220,255,230,${brightness*.9})`;
      if(t < .05){
        ctx.shadowBlur=8;
        ctx.shadowColor="#00ff88";
      }
    } else {
      ctx.fillStyle=`rgba(80,180,120,${brightness*.35})`;
      ctx.shadowBlur=0;
    }

    ctx.fill();
    ctx.shadowBlur=0;
  });

  ctx.restore();
  drawWaveTrace(.13);
}



/* ── lissajous wave trace ── */

function drawWaveTrace(lagBase){
  if(!analyser) return;
  analyser.getByteTimeDomainData(timeData);
  const lag = Math.floor(timeData.length*(lagBase+mid*.06));

  ctx.beginPath();
  for(let i=0;i<timeData.length;i+=3){
    const a = (timeData[i]-128)/128;
    const b = (timeData[(i+lag)%timeData.length]-128)/128;
    const x = cx + a*R*.50 + Math.sin(frame*.007)*8;
    const y = cy + b*R*.42 + Math.cos(frame*.005)*6;
    if(i===0) ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
  }
  ctx.strokeStyle="rgba(100,220,160,.52)";
  ctx.lineWidth=3.5;
  ctx.lineCap="round";
  ctx.shadowBlur=10;
  ctx.shadowColor="#00aa55";
  ctx.stroke();
  ctx.shadowBlur=0;
}

/* ── main loop ── */

function draw(){
  frame++;
  updateEnergy();
  clearPortal();

  if(mode==="process")   drawProcess();
  if(mode==="transform") drawTransform();
  if(mode==="manifold")  drawManifold();
  if(mode==="memory")    drawMemory();

  requestAnimationFrame(draw);
}

buildSelector();
loadTrack(0,false);
draw();
</script>

</body>
</html>
